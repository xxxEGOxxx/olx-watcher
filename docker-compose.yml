# Production topology on the shared `flotana` VPS. Isolated compose project: no host ports, no
# shared networks, its own volume. Never attach it to Flotana's networks or Caddy.
name: olx-watcher-production

services:
  watcher:
    image: olx-watcher:${OLX_IMAGE_TAG:?required}
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file: ${OLX_ENV_FILE:?required}
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      # HOME=/tmp: Chromium writes its profile and caches here; the root stays read-only.
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Chromium runs only during a poll (about a minute every 15); limits leave Flotana its RAM.
    pids_limit: 512
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

volumes:
  data:

# Production topology on the shared `flotana` VPS. Isolated compose project: no host ports, no
# shared networks, its own volume. Never attach it to Flotana's networks or Caddy.
name: olx-watcher-production

services:
  watcher:
    image: olx-watcher:${OLX_IMAGE_TAG:?required}
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file: ${OLX_ENV_FILE:?required}
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

volumes:
  data:
